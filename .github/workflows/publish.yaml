name: Publish Plugin

# 两种触发方式：
#   1. 推送 v* 标签 → event_name=push    → 构建 + 上传 Marketplace + 创建 Release
#   2. 手动触发        → event_name=workflow_dispatch → 仅构建，不发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      plugin-version:
        description: 'Plugin version (e.g. 1.2.3)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ---------- 版本号 ----------

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.plugin-version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 构建 ----------

      - name: Build plugin
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin

      # ---------- 发布（event_name=push，即 tag 推送时执行）----------

      - name: Upload to JetBrains Marketplace
        if: github.event_name == 'push'
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: |
          PLUGIN_FILE=$(find build/distributions -name '*.zip' -print -quit)
          echo "Uploading ${PLUGIN_FILE}..."
          curl --fail-with-body -i \
            -F "xmlId=io.github.yungyu16.markdown-image-paster" \
            -F "file=@${PLUGIN_FILE}" \
            -H "Authorization: Bearer ${JETBRAINS_TOKEN}" \
            https://plugins.jetbrains.com/plugin/uploadPlugin

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/distributions/*.zip